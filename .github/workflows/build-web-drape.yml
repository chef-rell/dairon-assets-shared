name: Build and validate Web Drape test piece

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Blender source + GLB delivery
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore build source and exact supplied 1024x1024 atlas
        shell: bash
        run: |
          set -euo pipefail
          cat build_payload.tar.gz.b64.part* > build_payload.tar.gz.b64
          base64 --decode build_payload.tar.gz.b64 > build_payload.tar.gz
          tar --extract --gzip --file build_payload.tar.gz
          echo "234286c266e5d9bbfe9a31b4b1694788112f3bd5897907f92e115871f3662264  assets/texture-sheet-shipping-palette-v3.png" | sha256sum --check --strict
          file assets/texture-sheet-shipping-palette-v3.png
          python3 -m py_compile scripts/*.py

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends blender
          blender --version

      - name: Build editable source and glTF binary
        shell: bash
        run: |
          set -euo pipefail
          blender --background --factory-startup --python scripts/build_web_drape.py

      - name: Re-open and validate Blender source
        shell: bash
        run: |
          set -euo pipefail
          blender --background dist/web_drape.blend --python scripts/validate_blend.py

      - name: Validate GLB, UVs, channels, and exact embedded atlas bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_delivery.py
          cat dist/DELIVERY_REPORT.md
          find dist -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload completed test piece
        uses: actions/upload-artifact@v4
        with:
          name: web-drape-test-piece
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          path: |
            dist/web_drape.glb
            dist/web_drape.blend
            dist/texture-sheet-shipping-palette-v3.png
            dist/DELIVERY_REPORT.md
            dist/validation.json
            dist/blend_validation.json
            dist/build_info.json
            scripts/build_web_drape.py
            scripts/validate_blend.py
            scripts/validate_delivery.py
